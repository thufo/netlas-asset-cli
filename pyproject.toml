[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netlas-asset-cli"
version = "0.2.0"
description = "A small, dependency-free CLI for authorized asset lookups with the Netlas API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Thufo" }
]
keywords = ["netlas", "osint", "asset-inventory", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
netlas-asset = "netlas_asset_cli.cli:main"

[project.urls]
Documentation = "https://docs.netlas.io/api-reference/"
Repository = "https://github.com/thufo/netlas-asset-cli"
Issues = "https://github.com/thufo/netlas-asset-cli/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
